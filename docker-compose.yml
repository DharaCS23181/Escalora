

services:
  postgres:
    image: postgres:15-alpine
    container_name: escalora_postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-escalora}
      - POSTGRES_USER=${POSTGRES_USER:-escalora}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-escalora} -d ${POSTGRES_DB:-escalora}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - escalora_net

  redis:
    image: redis:7-alpine
    container_name: escalora_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - escalora_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: escalora_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - escalora_net

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: escalora_celery_worker
    command: celery -A app.workers.celery_app worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - escalora_net

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: escalora_celery_beat
    command: celery -A app.workers.celery_app beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - escalora_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: escalora_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
    networks:
      - escalora_net

volumes:
  postgres_data:

networks:
  escalora_net:
    driver: bridge